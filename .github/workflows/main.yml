name: Build 🚀

on:
  workflow_dispatch: 
  push:
      branches:
        - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: Restore
        run: dotnet restore ./UrlShortener.sln

      - name: Build
        run: dotnet build ./UrlShortener.sln --configuration Release -no-restore
  
